const pages=['Command center','Connected accounts','Campaigns','Analytics','Content calendar','Leads & CRM','RZ AI Director','Automations','Budget & approvals','Audit & security'];const row=(a,b)=>`<div class="line"><span>${a}</span><span class="muted">${b}</span></div>`;const card=(a,b)=>`<div class="card"><h3>${a}</h3>${b}</div>`;function show(i) {

async function requestJSON(path,options={}){const r=await fetch(path,{...options,credentials:'same-origin'});if(!r.ok){
  const data=await r.json().catch(()=>null);
  const detail=typeof data?.detail==='string' ? data.detail : '';

  throw new Error(detail || (r.status===422 && field ? 'Check the '+field+' field.' : 'Request failed ('+r.status+')'));
}return r.json()}
async function draftPanel(i){panel.replaceChildren();panel.hidden=true;const kind=({2:'campaign',4:'content',5:'lead',7:'automation'})[i];if(!kind)return;panel.hidden=false;const heading=document.createElement('h3');heading.textContent='Saved '+kind+' drafts';panel.append(heading);const status=document.createElement('p');status.setAttribute('role','status');panel.append(status);const form=document.createElement('form');const workspace=document.createElement('select');workspace.required=true;workspace.setAttribute('aria-label','Workspace');form.append(workspace);const fields={};function field(name,label,type='text'){const l=document.createElement('label');l.style.display='block';l.style.margin='12px 0';l.textContent=label+' ';const input=document.createElement('input');input.type=type;input.required=true;l.append(input);form.append(l);fields[name]=input;return input}field('title','Title');if(kind==='campaign'){field('channel','Channel').value='facebook';field('objective','Objective').value='awareness';field('start','Start','date');field('end','End','date')}if(kind==='content'){field('channel','Channel').value='facebook';field('body','Content');field('planned_at','Planned local time','datetime-local')}if(kind==='automation'){field('task','Task').value='report';field('planned_at','Planned local time','datetime-local')}const save=document.createElement('button');save.type='submit';save.className='action';save.textContent='Save draft';save.disabled=true;form.append(save);panel.append(form);const records=document.createElement('div');panel.append(records);async function refresh(){records.replaceChildren();const rows=await requestJSON('/v1/workspaces/'+encodeURIComponent(workspace.value)+'/drafts');for(const r of rows.filter(r=>r.kind===kind)){const p=document.createElement('p');p.textContent=r.payload.title+' — draft — '+r.created_at;records.append(p)}if(!records.childNodes.length)records.textContent='No saved drafts.'}try{const ws=await requestJSON('/v1/workspaces');if(!form.isConnected)return;for(const w of ws){const o=document.createElement('option');o.value=w.id;o.textContent=w.name;workspace.append(o)}if(!ws.length){status.textContent='No authorized workspace available.';return}await refresh();save.disabled=false;workspace.onchange=()=>refresh().catch(e=>{status.textContent=e.message});form.onsubmit=async e=>{e.preventDefault();save.disabled=true;const payload={kind};for(const [k,v] of Object.entries(fields))payload[k]=k==='planned_at'?new Date(v.value).toISOString():v.value;try{await requestJSON('/v1/workspaces/'+encodeURIComponent(workspace.value)+'/drafts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});status.textContent='Draft saved. External execution disabled.';await refresh()}catch(e){status.textContent=e.message}finally{save.disabled=false}}}catch(e){status.textContent=e.message}}

const connectionSources = [['ga4','Google Analytics 4'],['search-console','Google Search Console'],['youtube','YouTube']];
const sourceErrors = {
  expired:'Start the connection again. The prior request expired or its session changed.',
  denied:'Google authorization was cancelled.',
  empty:'Google returned no accessible properties for that account.',
  reconnect:'Google authorization expired or was revoked. Reconnect this source.',
  'api-disabled':'Enable the required Google API in the OAuth client’s Google Cloud project.',
  permission:'The Google account lacks permission for this source or property.',
  failed:'Google could not list properties. Check which Google account you selected and whether the API is enabled in the OAuth project.'
};
const searchParams = new URLSearchParams(location.search);
const sourceMessage = searchParams.get('google_source');
const hubspotMessage = searchParams.get('hubspot');
const hubspotMessages = {
  connected:'HubSpot account connected.',
  expired:'Start HubSpot authorization again. The request expired or the session changed.',
  denied:'HubSpot authorization was cancelled.',
  failed:'HubSpot authorization failed. Check that you selected the approved account.'
};
const connectionMatch = location.hash.match(/^#connected(?:\/([A-Za-z0-9_-]{43}))?$/);
let pendingConnection = connectionMatch ? connectionMatch[1] : null;
let connectionMessage = hubspotMessages[hubspotMessage] || sourceErrors[sourceMessage] || '';

function connectionElement(tag, value) {
  const element = document.createElement(tag);
  if (value !== undefined) element.textContent = value;
  return element;
}

async function openConnections() {
  const container = document.getElementById('connections');
  if (!container) return;
  container.replaceChildren(connectionElement('h3','Data connections'));
  const status = connectionElement('p', connectionMessage);
  status.setAttribute('role','status');
  container.append(status);
  const workspaces = connectionElement('select');
  workspaces.setAttribute('aria-label','Connection workspace');
  const controls = connectionElement('div');
  const rows = connectionElement('div');
  const choices = connectionElement('form');
  const hubspot = connectionElement('div');
  container.append(workspaces,controls,rows,choices,hubspot);
  async function refreshHubSpot(workspace) {
    hubspot.textContent = 'Checking HubSpot connection…';
    const path = hubspotURL(workspace);
    try {
      const details = await requestJSON(path);
      if (workspace !== workspaces.value || !hubspot.isConnected) return;
      hubspot.replaceChildren(connectionElement('p', details.portal_id
        ? 'HubSpot account '+details.portal_id+' connected'
        : details.configured ? 'HubSpot account not connected' : 'HubSpot OAuth setup required'));
      if (!details.configured) return;
      const button = connectionElement('button', details.portal_id ? 'Reconnect HubSpot' : 'Connect HubSpot');
      button.type = 'button';
      button.onclick = async () => {
        button.disabled = true;
        try {
          const result = await requestJSON(path+'/start', {method:'POST'});
          location.assign(result.url);
        } catch(error) {
          if (workspace === workspaces.value) status.textContent = error.message;
          button.disabled = false;
        }
      };
      hubspot.append(button);
    } catch(error) {
      if (workspace === workspaces.value) hubspot.textContent = 'HubSpot connection status unavailable.';
    }
  }
  function workspaceURL() {
    return '/v1/workspaces/'+encodeURIComponent(workspaces.value)+'/google-sources';
  }
  async function refresh() {
    const selectedWorkspace = workspaces.value;
    rows.textContent = 'Reading saved connections…';
    const connected = await requestJSON(workspaceURL());
    if (workspaces.value !== selectedWorkspace || !container.isConnected) return;
    rows.replaceChildren();
    for (const [id, name] of connectionSources) {
      const properties = connected.filter(item => item.source===id);
      const line = connectionElement('p',name+': '+(properties.length ? properties.map(item=>item.name).join(', ') : id==='youtube' ? 'No channels selected' : 'No properties selected'));
      rows.append(line);
    }
  }
  try {
    for (const workspace of await requestJSON('/v1/workspaces')) {
      const option = connectionElement('option',workspace.name);
      option.value = workspace.id;
      workspaces.append(option);
    }
    if (!workspaces.value) {
      status.textContent = 'No authorized workspace.';
      return;
    }
    if (pendingConnection) {
      const grant = pendingConnection;
      const selection = await requestJSON('/v1/google-source-selection/'+encodeURIComponent(grant));
      workspaces.value = selection.workspace;
      workspaces.disabled = true;
      const resourceLabel = selection.source==='YouTube' ? 'channels' : 'properties';
      choices.append(connectionElement('h4','Select '+selection.source+' '+resourceLabel));
      for (const property of selection.properties) {
        const label = connectionElement('label');
        label.style.display = 'block';
        const box = connectionElement('input');
        box.type='checkbox';
        box.value=property.id;
        label.append(box,document.createTextNode(' '+property.name));
        choices.append(label);
      }
      const save = connectionElement('button','Save selected '+resourceLabel);
      save.className='action';
      choices.append(save);
      choices.onsubmit = async event => {
        event.preventDefault();
        const properties = Array.from(choices.querySelectorAll('input:checked'),input=>input.value);
        if (!properties.length) { status.textContent='Select at least one property.'; return; }
        save.disabled=true;
        try {
          const result = await requestJSON('/v1/google-source-selection',{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({grant,properties})
          });
          pendingConnection = null;
          connectionMessage = 'Saved '+result.connected+' '+resourceLabel+'.';
          history.replaceState(null,'','/#connected');
          await openConnections();
        } catch(error) {
          status.textContent=error.message;
          save.disabled=false;
        }
      };
    } else {
      for (const [id,name] of connectionSources) {
        const button=connectionElement('button','Connect '+name);
        button.className='action';
        button.type='button';
        button.onclick=async () => {
          button.disabled=true;
          try {
            const result=await requestJSON(workspaceURL()+'/'+id+'/start',{method:'POST'});
            location.assign(result.url);
          } catch(error) {
            status.textContent=error.message;
            button.disabled=false;
          }
        };
        controls.append(button);
      }
      workspaces.onchange = () => Promise.all([refresh(), refreshHubSpot(workspaces.value)])
        .catch(error=>{status.textContent=error.message});
    }
    await Promise.all([refresh(), refreshHubSpot(workspaces.value)]);
  } catch(error) {
    status.textContent=error.message;
  }
}
function hubspotURL(workspace) {
  return '/v1/workspaces/'+encodeURIComponent(workspace)+'/hubspot';
}

async function openHubSpotCRM() {
  const panel = document.getElementById('hubspot-crm');
  if (!panel) return;
  const workspace = connectionElement('select');
  workspace.setAttribute('aria-label','CRM workspace');
  const refresh = connectionElement('button','Refresh HubSpot data');
  refresh.type = 'button';
  refresh.disabled = true;
  const status = connectionElement('p','Reading workspaces…');
  status.setAttribute('role','status');
  const records = connectionElement('div');
  panel.replaceChildren(connectionElement('h3','HubSpot CRM'), workspace, refresh, status, records);
  async function load() {
    const selected = workspace.value;
    records.replaceChildren();
    status.textContent = 'Reading HubSpot CRM…';
    refresh.disabled = true;
    try {
      const path = hubspotURL(selected);
      const details = await requestJSON(path);
      if (workspace.value !== selected || !panel.isConnected) return;
      if (!details.portal_id) {
        status.textContent = details.configured
          ? 'Connect HubSpot in Connected accounts to see contacts and deals.'
          : 'HubSpot OAuth setup required.';
        return;
      }
      const data = await requestJSON(path+'/summary');
      if (workspace.value !== selected || !panel.isConnected) return;
      status.textContent = 'HubSpot account '+details.portal_id;
      for (const [key, title, name] of [
        ['contacts','Contacts', item => [item.firstname,item.lastname].filter(Boolean).join(' ') || 'Unnamed contact'],
        ['deals','Deals', item => item.dealname || 'Unnamed deal']
      ]) {
        const group = data[key];
        records.append(connectionElement('h4',title));
        if (!group.rows.length) {
          records.append(connectionElement('p','No '+key+' returned by HubSpot.'));
          continue;
        }
        const list = connectionElement('ul');
        for (const item of group.rows) list.append(connectionElement('li',name(item)));
        records.append(list);
        if (group.has_more) records.append(connectionElement('p','Showing the first '+group.rows.length+' '+key+'.'));
      }
    } catch(error) {
      if (workspace.value === selected) status.textContent = 'Could not read HubSpot CRM. Refresh or reconnect in Connected accounts.';
    } finally {
      if (workspace.value === selected) refresh.disabled = false;
    }
  }
  workspace.onchange = refresh.onclick = load;
  try {
    for (const item of await requestJSON('/v1/workspaces')) {
      const option = connectionElement('option',item.name);
      option.value = item.id;
      workspace.append(option);
    }
    if (workspace.value) await load();
    else status.textContent = 'No authorized workspace.';
  } catch(error) {
    status.textContent = 'Could not load workspaces.';
  }
}

function drawGoogleTrend(canvas, points, metric, realtime, start, end) {
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  if (!width || !height) return;
  const ratio = window.devicePixelRatio || 1;
  canvas.width = Math.round(width * ratio);
  canvas.height = Math.round(height * ratio);
  const ctx = canvas.getContext('2d');
  ctx.scale(ratio, ratio);
  const left = 52, top = 18, right = width - 8, bottom = height - 18;
  const plotWidth = right - left, plotHeight = bottom - top;
  const max = Math.max(1, ...points.map(point => point[metric]));
  const step = max <= 4 ? 1 : Math.ceil(max / 4);
  const ceiling = step * 4;
  ctx.font = '11px system-ui';
  ctx.fillStyle = '#a6b6ca';
  ctx.strokeStyle = '#273748';
  const format = new Intl.NumberFormat(undefined,{notation:'compact'});
  for (let i = 0; i <= 4; i++) {
    const y = bottom - i * plotHeight / 4;
    ctx.fillText(format.format(step * i),2,y+4);
    ctx.beginPath();
    ctx.moveTo(left,y);
    ctx.lineTo(right,y);
    ctx.stroke();
  }
  const day = value => Date.parse(value+'T00:00:00Z') / 86400000;
  const duration = realtime ? 29 : Math.max(1,day(end)-day(start));
  const bars = Math.max(3, Math.min(22, plotWidth/(duration+1)*.65));
  const gradient = ctx.createLinearGradient(0,top,0,bottom);
  gradient.addColorStop(0,'#83f1c8');
  gradient.addColorStop(1,'#286e62');
  ctx.fillStyle=gradient;
  for (const point of points) {
    const offset = realtime ? 29-Number(point.time) : day(point.time)-day(start);
    const x = left + (offset+.5)*(plotWidth-bars)/(duration+1);
    const size = point[metric]*plotHeight/ceiling;
    if (Number.isFinite(size) && Number.isFinite(x) && size > 0) ctx.fillRect(x,bottom-size,bars,size);
  }
}

async function openGoogleAnalytics() {
  const panel = document.getElementById('google-analytics');
  if (!panel) return;
  const make = connectionElement;
  const controls = make('div');
  controls.className = 'card analytics-toolbar';
  const select = (name,parent) => {
    const label=make('label',name), input=make('select');
    label.append(input);
    parent.append(label);
    return input;
  };
  const option = (input,label,value) => {
    const element = make('option',label);
    element.value=value;
    input.append(element);
  };
  const workspace = select('Workspace',controls);
  const property = select('Property or channel',controls);
  const days = select('Date range',controls);
  for (const value of [7,28,90]) option(days,'Last '+value+' days',value);
  days.value='28';
  const refresh = make('button','Refresh');
  refresh.className='action';
  refresh.type='button';
  controls.append(refresh);
  const source = make('div');
  source.className='analytics-source';
  const heading = make('div');
  const name = make('h2','Google reporting'), description = make('p');
  heading.append(name,description);
  const segment = make('div');
  segment.className='segment';
  const historyButton=make('button','Historical'), realtimeButton=make('button','Realtime');
  segment.append(historyButton,realtimeButton);
  source.append(heading,segment);
  const metrics=make('div');
  metrics.className='analytics-kpis';
  const plot=make('section');
  plot.className='card analytics-plot';
  const plotHead=make('div');
  plotHead.className='plot-head';
  const title=make('h3','Activity'), stamp=make('small');
  plotHead.append(title,stamp);
  const status=make('p');
  status.className='analytics-note';
  status.setAttribute('role','status');
  const canvas=make('canvas');
  canvas.setAttribute('role','img');
  const foot=make('div');
  foot.className='analytics-foot';
  const table=make('details');
  table.className='analytics-table';
  plot.append(plotHead,status,canvas,foot,table);
  panel.replaceChildren(controls,source,metrics,plot);
  let properties=[], realtime=false, metric='', result=null, inflight=null, timer=null, revision=0;
  let healthy=false, refreshedAt=null;
  function clearPoll() { clearTimeout(timer); }
  function schedulePoll() {
    clearPoll();
    if (realtime && panel.isConnected && !document.hidden) timer=setTimeout(loadReport,60000);
  }
  const resize = new ResizeObserver(() => { if (result && !canvas.hidden) draw(); });
  resize.observe(canvas);
  const dispose = new MutationObserver(() => {
    if (panel.isConnected) return;
    clearPoll();
    inflight?.abort();
    dispose.disconnect();
    resize.disconnect();
    document.removeEventListener('visibilitychange',visibility);
  });
  dispose.observe(panel.parentNode,{childList:true});
  function visibility() {
    clearPoll();
    if (!document.hidden && realtime && !inflight) loadReport();
  }
  document.addEventListener('visibilitychange',visibility);
  function draw() {
    drawGoogleTrend(canvas,result.series.filter(point=>Number.isFinite(point[metric])),metric,realtime,result.start,result.end);
  }
  function render() {
    const item=properties[property.value];
    const isGA=item?.source==='ga4';
    const labels=isGA ? (realtime ? ['Active users','Events'] : ['Sessions','Views']) : item?.source==='youtube' ? ['Views','Watch time (min)'] : ['Impressions','Clicks'];
    if (!labels.includes(metric)) metric=labels[0];
    name.textContent=item?.name || 'Google reporting';
    description.textContent=item ? ((connectionSources.find(([id])=>id===item.source)?.[1] || 'Google')+' · '+(realtime ? 'Last 30 minutes · refreshes every minute' : 'Daily reporting')) : '';
    realtimeButton.hidden=!isGA;
    segment.hidden=!isGA;
    historyButton.setAttribute('aria-pressed',String(!realtime));
    realtimeButton.setAttribute('aria-pressed',String(realtime));
    days.disabled=realtime || !item;
    refresh.disabled=!!inflight || !item;
    title.textContent=metric+' over time';
    stamp.textContent=refreshedAt ? 'Updated '+refreshedAt.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+(healthy ? '' : ' · stale') : '';
    metrics.replaceChildren();
    metrics.hidden=!item;
    for (const label of labels) {
      const tile=make('button');
      tile.type='button';
      tile.className='analytics-kpi';
      tile.setAttribute('aria-pressed',String(metric===label));
      const value=result?.metrics[label];
      tile.append(make('span',label),make('strong',Number.isFinite(value) ? value.toLocaleString() : '—'));
      tile.onclick=()=>{metric=label;render();};
      metrics.append(tile);
    }
    const points=(result?.series || []).slice().sort((a,b)=>realtime ? Number(b.time)-Number(a.time) : a.time.localeCompare(b.time));
    canvas.hidden=!points.some(point=>Number.isFinite(point[metric]));
    foot.replaceChildren();
    table.replaceChildren();
    table.hidden=canvas.hidden;
    if (canvas.hidden) return;
    canvas.setAttribute('aria-label',metric+' chart. Open the data table below for exact values.');
    foot.append(make('span',realtime ? '29 minutes ago' : result.start),make('span',realtime ? 'Now' : result.end));
    draw();
    table.append(make('summary','View data table'));
    const grid=make('table'), head=make('thead'), row=make('tr');
    for (const label of [realtime ? 'Minute' : 'Date',...labels]) row.append(make('th',label));
    head.append(row);
    const body=make('tbody');
    for (const point of points) {
      const line=make('tr');
      line.append(make('td',realtime ? point.time+' min ago' : point.time));
      for (const label of labels) line.append(make('td',point[label]?.toLocaleString() ?? '—'));
      body.append(line);
    }
    grid.append(head,body);
    table.append(grid);
  }
  function feedback(message,error=false) {
    status.hidden=!message;
    status.textContent=message;
    status.dataset.error=String(error);
  }
  function reset() {
    clearPoll();
    inflight?.abort();
    inflight=null;
    result=null;
    healthy=false;
    refreshedAt=null;
  }
  async function loadReport() {
    clearPoll();
    const item=properties[property.value];
    if (!item || inflight || !panel.isConnected) return;
    const controller=new AbortController();
    inflight=controller;
    if (!result) feedback('Reading Google data…');
    render();
    const base='/v1/workspaces/'+encodeURIComponent(workspace.value)+'/google-sources';
    const query=new URLSearchParams({property_id:item.id,series:'true',days:days.value});
    if (realtime) query.set('realtime','true');
    try {
      const response=await fetch(base+'/'+item.source+'/report?'+query,{signal:controller.signal,credentials:'same-origin'});
      const data=await response.json();
      if (controller.signal.aborted || !panel.isConnected) return;
      if (!response.ok) throw new Error(sourceErrors[data.detail] || 'Google report could not be loaded.');
      result=data;
      healthy=true;
      refreshedAt=new Date();
      feedback(data.series.length ? '' : realtime ? 'Google reports no activity in the last 30 minutes.' : 'Google returned no data for this date range.');
    } catch (error) {
      if (controller.signal.aborted || !panel.isConnected) return;
      healthy=false;
      feedback(error.message,true);
    } finally {
      if (inflight===controller) {
        inflight=null;
        if (panel.isConnected) {
          render();
          if (healthy || !result) schedulePoll();
        }
      }
    }
  }
  async function listProperties() {
    const current=++revision;
    reset();
    realtime=false;
    metric='';
    properties=[];
    property.replaceChildren();
    render();
    feedback('Loading connected properties…');
    try {
      const base='/v1/workspaces/'+encodeURIComponent(workspace.value)+'/google-sources';
      const saved=await requestJSON(base);
      if (current!==revision || !panel.isConnected) return;
      properties=saved.slice().sort((a,b)=>Number(b.source==='search-console')-Number(a.source==='search-console') || a.name.localeCompare(b.name));
      properties.forEach((item,index)=>option(property,item.name,index));
      property.disabled=!properties.length;
      if (!properties.length) feedback('No connected properties. Add a Google source in Connected accounts.');
      render();
      if (properties.length) await loadReport();
    } catch(error) { if (current===revision) feedback(error.message,true); }
  }
  const chooseMode = selected => {
    if (realtime===selected) return;
    realtime=selected;
    reset();
    loadReport();
  };
  workspace.onchange=listProperties;
  property.onchange=()=>{realtime=false;reset();loadReport();};
  days.onchange=()=>{reset();loadReport();};
  refresh.onclick=loadReport;
  historyButton.onclick=()=>chooseMode(false);
  realtimeButton.onclick=()=>chooseMode(true);
  render();
  try {
    for (const item of await requestJSON('/v1/workspaces')) option(workspace,item.name,item.id);
    if (!panel.isConnected) return;
    if (workspace.value) await listProperties();
    else feedback('No authorized workspace.');
  } catch(error) { feedback(error.message,true); }
}

const channelLabels = {'ga4':'Google Analytics 4','search-console':'Google Search Console','youtube':'YouTube'};

async function openChannelWorkspace() {
  const container = document.getElementById('channel-workspace');
  if (!container) return;
  const el = connectionElement;
  const hero = el('div');
  hero.className = 'channel-hero';
  const heading = el('div');
  heading.append(el('h2','Channel performance'),el('p','Last 7 completed days across your connected channels'));
  const controls = el('div');
  controls.className = 'channel-controls';
  const label = el('label','Workspace');
  const workspace = el('select');
  const refresh = el('button','Refresh data');
  refresh.type = 'button';
  refresh.className = 'action';
  refresh.disabled = true;
  label.append(workspace);
  controls.append(label,refresh);
  hero.append(heading,controls);
  const status = el('p','Loading workspaces…');
  status.setAttribute('role','status');
  const cards = el('div');
  cards.className = 'channel-grid';
  const columns = el('div');
  columns.className = 'channel-columns';

  const director = el('section');
  director.className = 'card channel-panel';
  const form = el('form');
  form.className = 'channel-controls';
  const objectiveLabel = el('label','Brief type');
  const objective = el('select');
  for (const [key, title] of [['summary','Performance summary'],['growth','Growth experiment'],['content','Content idea']]) {
    const item = el('option',title);
    item.value = key;
    objective.append(item);
  }
  objectiveLabel.append(objective);
  const run = el('button','Generate brief');
  run.type = 'submit';
  run.className = 'action';
  run.disabled = true;
  form.append(objectiveLabel,run);
  const aiStatus = el('p','Qwen 2.5 3B · Local draft for review');
  aiStatus.setAttribute('role','status');
  const result = el('div');
  director.append(el('h3','Marketing Director'),form,aiStatus,result);

  const activity = el('section');
  activity.className = 'card channel-panel';
  const events = el('ul');
  events.className = 'channel-activity';
  activity.append(el('h3','Recent activity'),events);
  columns.append(director,activity);
  container.replaceChildren(hero,status,cards,columns);

  let revision = 0;
  const path = () => '/v1/workspaces/'+encodeURIComponent(workspace.value);
  const nav = index => document.querySelectorAll('nav button')[index].click();
  function link(label, index) {
    const button = el('button',label);
    button.type = 'button';
    button.className = 'action';
    button.onclick = () => nav(index);
    return button;
  }
  function drawCards(data) {
    const rendered = [];
    for (const [source, title] of Object.entries(channelLabels)) {
      const record = data.reports.find(item=>item.source===source);
      const card = el('section');
      card.className = 'card channel-card';
      card.append(el('h3',title));
      if (!record) {
        card.append(el('p','No saved connection.'),link('Connect account',1));
      } else {
        card.append(el('p',record.name));
        if (record.status==='available') {
          const metrics = el('dl');
          metrics.className = 'channel-metrics';
          for (const [metric,value] of Object.entries(record.metrics)) {
            const pair = el('div');
            pair.append(el('dt',metric),el('dd',new Intl.NumberFormat().format(value)));
            metrics.append(pair);
          }
          card.append(metrics,el('p',record.start+' to '+record.end),link('Open Analytics',3));
        } else if (record.status==='empty') {
          card.append(el('p','Provider returned no rows for this period.'),link('Open Analytics',3));
        } else {
          const reasons = {reconnect:'Authorization expired or was revoked.', 'api-disabled':'Provider API is disabled.', permission:'Account lacks access to this report.'};
          card.append(el('p',reasons[record.detail]||'Provider report unavailable.'),link('Manage connection',1));
        }
      }
      rendered.push(card);
    }
    cards.replaceChildren(...rendered);
  }
  async function loadActivity(base, version) {
    events.replaceChildren(el('li','Loading recorded activity…'));
    const [tools,drafts] = await Promise.allSettled([
      requestJSON(base+'/activity'),requestJSON(base+'/drafts'),
    ]);
    if (!container.isConnected || version!==revision) return;
    const rows=[];
    if (tools.status==='fulfilled') for (const item of tools.value) {
      rows.push({label:item.tool+' · '+item.outcome, date:item.created_at});
    }
    if (drafts.status==='fulfilled') for (const item of drafts.value) {
      rows.push({label:(item.payload?.title || item.kind)+' · Draft saved', date:item.created_at});
    }
    rows.sort((a,b)=>Date.parse(b.date)-Date.parse(a.date));
    events.replaceChildren(...rows.slice(0,8).map(item=>{
      const li = el('li',item.label);
      const date = new Date(item.date);
      if (!Number.isNaN(date.valueOf())) {
        const time = el('time',date.toLocaleString());
        time.dateTime = date.toISOString();
        li.append(time);
      }
      return li;
    }));
    if (!rows.length && tools.status==='fulfilled' && drafts.status==='fulfilled') events.append(el('li','No activity recorded for this workspace.'));
    if (tools.status==='rejected' || drafts.status==='rejected') events.append(el('li','Some activity could not be loaded.'));
  }
  async function load() {
    if (!workspace.value) return;
    const base = path();
    const version = ++revision;
    refresh.disabled = true;
    run.disabled = true;
    result.replaceChildren();
    aiStatus.textContent = 'Qwen 2.5 3B · Local draft for review';
    cards.replaceChildren();
    status.textContent = 'Checking live provider reports…';
    const activityRequest = loadActivity(base, version);
    try {
      const data = await requestJSON(base+'/channel-overview');
      if (version!==revision || !container.isConnected) return;
      drawCards(data);
      const count = data.reports.filter(item=>item.status==='available').length;
      status.textContent = count+' of 3 channels returned metrics · '+data.properties+' saved properties or channels';
      status.className = 'channel-status';
    } catch(error) {
      if (version===revision) status.textContent = error.message;
    } finally {
      if (version===revision) refresh.disabled = run.disabled = false;
    }
    await activityRequest;
  }
  workspace.onchange = refresh.onclick = load;
  form.onsubmit = async event => {
    event.preventDefault();
    if (run.disabled) return;
    const version = revision;
    run.disabled = true;
    result.replaceChildren();
    aiStatus.textContent = 'Refreshing channel evidence and writing the brief…';
    try {
      const brief = await requestJSON(path()+'/channel-brief', {
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({objective:objective.value}),
      });
      if (version!==revision || !container.isConnected) return;
      aiStatus.textContent = 'Draft generated from '+brief.evidence.length+' provider report'+(brief.evidence.length===1?'':'s')+'.';
      const draft = el('div');
      draft.className = 'channel-brief';
      draft.append(el('p',brief.brief),el('h4','Suggested next step'),el('p',brief.next_step));
      const evidence = el('ul');
      for (const report of brief.evidence) {
        const totals = Object.entries(report.metrics).map(([name,value])=>name+' '+new Intl.NumberFormat().format(value));
        evidence.append(el('li',channelLabels[report.source]+' · '+report.start+' to '+report.end+' · '+totals.join(', ')));
      }
      result.append(draft,el('h4','Provider evidence'),evidence);
      if (brief.missing_sources.length) result.append(el('p','Missing metrics from '+brief.missing_sources.map(key=>channelLabels[key]).join(', ')+'.'));
    } catch(error) {
      if (version===revision) aiStatus.textContent = error.message;
    } finally {
      if (version===revision) run.disabled = false;
    }
  };
  try {
    for (const value of await requestJSON('/v1/workspaces')) {
      const option = el('option',value.name);
      option.value = value.id;
      workspace.append(option);
    }
    if (workspace.value) await load();
    else status.textContent = 'No workspace available for this account.';
  } catch(error) {
    status.textContent = error.message;
  }
}

const googleLink = document.getElementById('google-link-form');
googleLink?.addEventListener('submit', async event => {
  event.preventDefault();
  const password = document.getElementById('google-link-password');
  const code = document.getElementById('google-link-code');
  const status = document.getElementById('google-link-status');
  const button = googleLink.querySelector('button');
  if (button.disabled) return;
  button.disabled = true;
  status.textContent = '';
  try {
    const response = await fetch('/v1/auth/google/link', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: password.value, code: code.value})
    });
    if (response.status === 429) {
      status.textContent = 'Too many attempts. Wait before trying again.';
      return;
    }
    if (!response.ok) {
      status.textContent = 'Could not verify the account. Check your password and enter a fresh authenticator code.';
      return;
    }
    const result = await response.json();
    location.assign(result.authorization_url);
  } catch {
    status.textContent = 'Could not start Google linking. Try again.';
  } finally {
    password.value = '';
    code.value = '';
    button.disabled = false;
  }
});
