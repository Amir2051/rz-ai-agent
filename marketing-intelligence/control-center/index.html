const pages=['Weekly Review','Connected accounts','Campaigns','Analytics','Content calendar','Leads & CRM','MIA','Automations','Budget & approvals','Audit & security'];const row=(a,b)=>`<div class="line"><span>${a}</span><span class="muted">${b}</span></div>`;const card=(a,b)=>`<div class="card"><h3>${a}</h3>${b}</div>`;function show(i) {
  document.getElementById('title').textContent=pages[i];
  document.body.classList.toggle('weekly',i===0||i===1||i===6);
  document.querySelectorAll('nav button').forEach((button,j)=>{
    button.classList.toggle('active',i===j);
    if(i===j) button.setAttribute('aria-current','page');
    else button.removeAttribute('aria-current');
  });
  const views = {
    0:'<section class="channel-workspace" id="channel-workspace"></section>',
    1:'<section class="connections-page" id="connections"></section>',
    3:'<section class="analytics" id="google-analytics"></section>',
    5:'<section class="card" id="hubspot-crm"></section>',
    6:'<section class="channel-workspace" id="channel-workspace"></section>',
    8:card('Budget controls',row('Spending','No spending through this dashboard')+row('Publishing','Drafts only')),
  };
  document.getElementById('view').innerHTML=views[i]||'';
}
pages.forEach((name,i)=>{
  const button=document.createElement('button');
  button.textContent=name;
  button.type='button';
  button.onclick=()=>show(i);
  document.getElementById('nav').append(button);
});
const panel=document.getElementById('draft-panel');
async function requestJSON(path,options={}){const r=await fetch(path,{...options,credentials:'same-origin'});if(!r.ok){
  const data=await r.json().catch(()=>null);
  const detail=typeof data?.detail==='string' ? data.detail : '';
  const field=Array.isArray(data?.detail) ? data.detail[0]?.loc?.at(-1) : '';
  throw new Error(detail || (r.status===422 && field ? 'Check the '+field+' field.' : 'Request failed ('+r.status+')'));
}return r.json()}
function choiceCards(label, {compact = false} = {}) {
  const root = connectionElement('div');
  root.className = 'choice-cards'+(compact ? ' choice-cards-compact' : '');
  root.setAttribute('role','group');
  root.setAttribute('aria-label',label);
  const title = connectionElement('strong',label);
  const options = connectionElement('div');
  options.className = 'choice-options';
  root.append(title,options);
  root.hidden = true;
  let selected = '';
  let disabled = false;
  const control = {
    root,
    onchange: null,
    get value() { return selected; },
    set value(value) {
      const matching = Array.from(options.children).find(item=>item.dataset.value===String(value));
      selected = matching ? String(value) : '';
      for (const button of options.children) button.setAttribute('aria-pressed',String(button===matching));
    },
    set disabled(value) {
      disabled = Boolean(value);
      for (const button of options.children) button.disabled = disabled;
    },
    setOptions(items, preferred = selected) {
      const buttons = items.map(({id,name,note})=>{
        const button = connectionElement('button');
        button.type = 'button';
        button.dataset.value = String(id);
        button.disabled = disabled;
        button.append(connectionElement('span',name));
        if (note) button.append(connectionElement('small',note));
        button.onclick = () => {
          if (button.dataset.value===selected) return;
          control.value = button.dataset.value;
          control.onchange?.();
        };
        return button;
      });
      options.replaceChildren(...buttons);
      root.hidden = !buttons.length;
      control.value = buttons.some(button=>button.dataset.value===String(preferred)) ? preferred : buttons[0]?.dataset.value;
    },
  };
  return control;
}

const sourceErrors = {
  expired:'Start the connection again. The prior request expired or its session changed.',
  denied:'Google authorization was cancelled.',
  empty:'Google returned no accessible properties for that account.',
  reconnect:'Google authorization expired or was revoked. Reconnect this source.',
  'api-disabled':'Enable the required Google API in the OAuth client’s Google Cloud project.',
  permission:'The Google account lacks permission for this source or property.',
  failed:'Google could not list properties. Check which Google account you selected and whether the API is enabled in the OAuth project.'
};
const searchParams = new URLSearchParams(location.search);
const sourceMessage = searchParams.get('google_source');
const hubspotMessage = searchParams.get('hubspot');
const hubspotMessages = {
  connected:'HubSpot account connected.',
  expired:'Start HubSpot authorization again. The request expired or the session changed.',
  denied:'HubSpot authorization was cancelled.',
  failed:'HubSpot authorization failed. Check that you selected the approved account.'
};
const connectionMatch = location.hash.match(/^#connected(?:\/([A-Za-z0-9_-]{43}))?$/);
let pendingConnection = connectionMatch ? connectionMatch[1] : null;
let connectionMessage = hubspotMessages[hubspotMessage] || sourceErrors[sourceMessage] || '';

function connectionElement(tag, value) {
  const element = document.createElement(tag);
  if (value !== undefined) element.textContent = value;
  return element;
}

const firebaseAccountSuffix = ' (Default Account for Firebase)';
function sourceDisplayName(source, name) {
  return source==='ga4' && name?.endsWith(firebaseAccountSuffix) && name.length>firebaseAccountSuffix.length
    ? name.slice(0,-firebaseAccountSuffix.length)
    : name;
}

let requestedAnalytics = null;
let connectionWorkspace = '';

async function openConnections() {
  const container = document.getElementById('connections');
  if (!container) return;
  const el = connectionElement;
  const providers = [
    {id:'ga4', name:'Google Analytics 4', mark:'GA', single:'property', description:'Import site traffic and recent activity from the properties you select.', item:'properties'},
    {id:'search-console', name:'Google Search Console', mark:'SC', single:'site', description:'See how your verified sites perform in Google Search.', item:'sites'},
    {id:'youtube', name:'YouTube', mark:'YT', single:'channel', description:'Read views and watch time for your selected YouTube channels.', item:'channels'},
    {id:'hubspot', name:'HubSpot', mark:'HS', single:'account', description:'Bring contacts and deals into your workspace’s CRM view.', item:'accounts'},
  ];
  const heading = el('header');
  heading.className = 'connections-heading';
  heading.append(el('p','Read-only integrations'),
    el('h1','Connected accounts'),
    el('p','Choose which Google properties, YouTube channels, or HubSpot account this workspace can read.'));
  const status = el('p',connectionMessage);
  status.className = 'connections-message';
  status.setAttribute('role','status');
  status.hidden = !connectionMessage;
  function message(text) {
    status.textContent = text;
    status.hidden = !text;
  }
  const context = el('div');
  context.className = 'connections-context';
  const choices = el('form');
  choices.className = 'card connections-selection';
  choices.hidden = true;
  const cards = el('div');
  cards.className = 'connections-grid';
  container.replaceChildren(heading,context,status,choices,cards);
  let workspace = '';
  let revision = 0;
  let selecting = false;

  function action(text, handler) {
    const button = el('button',text);
    button.type = 'button';
    button.className = 'action';
    button.onclick = handler;
    return button;
  }

  function drawCard(provider, info, base, activeRevision) {
    const card = el('article');
    card.className = 'card connection-card';
    const head = el('div');
    head.className = 'connection-card-head';
    const mark = el('span',provider.mark);
    mark.className = 'connection-mark';
    mark.dataset.provider = provider.id;
    mark.setAttribute('aria-hidden','true');
    const badge = el('span',info.label);
    badge.className = 'channel-badge';
    badge.dataset.tone = info.state==='error'||info.state==='setup' ? 'review' : info.state==='connected' ? 'verified' : 'neutral';
    head.append(mark,badge);

    const title = el('div');
    title.className = 'connection-card-title';
    title.append(el('h3',provider.name),el('p',provider.description));
    const content = el('div');
    content.className = 'connection-card-details';
    if (info.records?.length) {
      const {records} = info;
      const list = el('ul');
      const firebase = provider.id==='ga4' && records.every(record=>sourceDisplayName('ga4',record.name)!==record.name);
      if (provider.id==='ga4') list.className = 'connection-property-list';
      for (const record of records) {
        const name = sourceDisplayName(provider.id,record.name);
        const item = el('li');
        if (provider.id==='ga4' && !selecting) {
          const button = action(name,()=>{
            requestedAnalytics = {workspace,property:record.id};
            document.querySelectorAll('nav button')[3].click();
          });
          button.className = 'connection-report-link';
          button.setAttribute('aria-label','View Analytics report for '+name);
          item.append(button);
        } else item.textContent = name;
        if (!firebase && provider.id==='ga4' && name!==record.name) item.append(el('small','Firebase'));
        list.append(item);
      }
      content.append(el('strong',records.length+' '+(records.length===1 ? provider.single : provider.item)+' saved'));
      if (firebase) content.append(el('p','Firebase account'+(selecting ? '' : ' · Choose a property to open its report.')));
      else if (provider.id==='ga4' && !selecting) content.append(el('p','Choose a property to open its report.'));
      content.append(list);
    } else {
      content.append(el('p',info.note));
    }

    card.append(head,title,content);
    if (!selecting && info.state!=='setup' && info.state!=='loading') {
      const footer = el('div');
      footer.className = 'connection-card-actions';
      if (info.state==='error') {
        footer.append(action('Retry status',refresh));
      } else {
        const text = provider.id==='ga4' && info.state==='connected' ? 'Add or reconnect properties'
          : (info.state==='connected' ? 'Reconnect ' : 'Connect ')+provider.name;
        const connect = action(text,async () => {
          if (revision!==activeRevision || !container.isConnected) return;
          connect.disabled = true;
          message('');
          const path = provider.id==='hubspot' ? base+'/hubspot/start' : base+'/google-sources/'+provider.id+'/start';
          try {
            const result = await requestJSON(path,{method:'POST'});
            if (revision===activeRevision && container.isConnected) location.assign(result.url);
          } catch(error) {
            if (revision===activeRevision && container.isConnected) message(error.message);
          } finally {
            connect.disabled = false;
          }
        });
        if (info.state==='connected') connect.className = 'connection-secondary';
        footer.append(connect);
      }
      card.append(footer);
    }
    return card;
  }

  async function refresh() {
    if (!workspace) return;
    const base = '/v1/workspaces/'+encodeURIComponent(workspace);
    const version = ++revision;
    const current = () => version===revision && container.isConnected;
    const loading = {label:'Checking',state:'loading',note:'Reading saved connections…'};
    cards.setAttribute('aria-busy','true');
    cards.replaceChildren(...providers.map(provider=>drawCard(provider,loading,base,version)));
    const unavailable = {label:'Unavailable',state:'error',note:'Connection status could not be loaded.'};
    const google = requestJSON(base+'/google-sources').then(records=>{
      if (!current()) return;
      for (const [index,provider] of providers.entries()) {
        if (provider.id==='hubspot') continue;
        const saved = records.filter(record=>record.source===provider.id);
        const info = saved.length ? {label:'Connected',state:'connected',records:saved}
          : {label:'Not connected',state:'unsaved',note:'No '+provider.item+' selected yet.'};
        cards.children[index].replaceWith(drawCard(provider,info,base,version));
      }
    }).catch(()=>{
      if (!current()) return;
      for (const [index,provider] of providers.entries()) {
        if (provider.id!=='hubspot') cards.children[index].replaceWith(drawCard(provider,unavailable,base,version));
      }
    });
    const hubspot = requestJSON(base+'/hubspot').then(details=>{
      if (!current()) return;
      const info = details.portal_id ? {label:'Connected',state:'connected',records:[{name:'HubSpot account '+details.portal_id}]}
        : details.configured ? {label:'Not connected',state:'unsaved',note:'No HubSpot account authorized yet.'}
        : {label:'Setup required',state:'setup',note:'An administrator must configure HubSpot OAuth.'};
      cards.lastElementChild.replaceWith(drawCard(providers.at(-1),info,base,version));
    }).catch(()=>{
      if (current()) cards.lastElementChild.replaceWith(drawCard(providers.at(-1),unavailable,base,version));
    });
    await Promise.all([google,hubspot]);
    if (current()) cards.removeAttribute('aria-busy');
  }

  function drawWorkspace(workspaces) {
    const active = workspaces.find(item=>item.id===workspace);
    if (!active) return;
    const label = el('strong','Workspace');
    if (workspaces.length===1||selecting) {
      context.replaceChildren(label,el('span',active.name));
      return;
    }
    const options = el('div');
    options.className = 'connections-workspaces';
    options.setAttribute('role','group');
    options.setAttribute('aria-label','Connection workspace');
    for (const item of workspaces) {
      const button = el('button',item.name);
      button.type = 'button';
      button.setAttribute('aria-pressed',String(item.id===workspace));
      button.onclick = () => {
        if (item.id===workspace) return;
        connectionWorkspace = workspace = item.id;
        for (const option of options.children) option.setAttribute('aria-pressed',String(option===button));
        connectionMessage = '';
        message('');
        refresh();
      };
      options.append(button);
    }
    context.replaceChildren(label,options);
  }

  function clearSelection() {
    pendingConnection = null;
    history.replaceState(null,'','/#connected');
  }

  function drawSelection(grant, selection) {
    const provider = providers.find(item=>item.name===selection.source);
    const items = provider?.item || 'properties';
    const list = el('div');
    list.className = 'connections-choices';
    const firebase = provider?.id==='ga4' && selection.properties.length>0
      && selection.properties.every(item=>sourceDisplayName('ga4',item.name)!==item.name);
    choices.hidden = false;
    choices.append(el('h3','Choose '+selection.source+' '+items),
      el('p','SafeNestT will read data from the '+items+' you select.'));
    if (firebase) choices.append(el('p','Firebase account'));
    choices.append(list);
    for (const property of selection.properties) {
      const label = el('label');
      const box = el('input');
      box.type = 'checkbox';
      box.value = property.id;
      label.append(box,el('span',firebase ? sourceDisplayName('ga4',property.name) : property.name));
      list.append(label);
    }
    const footer = el('div');
    footer.className = 'connection-card-actions';
    const save = el('button','Save selected '+items);
    save.className = 'action';
    save.type = 'submit';
    const cancel = action('Cancel',()=>{
      clearSelection();
      connectionMessage = '';
      openConnections();
    });
    cancel.className = 'connection-secondary';
    footer.append(save,cancel);
    choices.append(footer);
    choices.onsubmit = async event => {
      event.preventDefault();
      const properties = Array.from(list.querySelectorAll('input:checked'),input=>input.value);
      if (!properties.length) {
        message('Select at least one item before saving.');
        list.querySelector('input')?.focus();
        return;
      }
      save.disabled = cancel.disabled = true;
      try {
        const result = await requestJSON('/v1/google-source-selection',{
          method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grant,properties}),
        });
        clearSelection();
        connectionMessage = 'Saved '+result.connected+' '+(result.connected===1 ? 'connection' : 'connections')+'.';
        if (container.isConnected) await openConnections();
      } catch(error) {
        if (container.isConnected) message(error.message);
        save.disabled = cancel.disabled = false;
      }
    };
  }

  try {
    if (!connectionMessage) message('Loading workspaces…');
    const workspaces = await requestJSON('/v1/workspaces');
    if (!container.isConnected) return;
    if (!workspaces.length) {
      message('No workspace is available for this account.');
      return;
    }
    workspace = workspaces.some(item=>item.id===connectionWorkspace) ? connectionWorkspace : workspaces[0].id;
    message(connectionMessage);
    if (pendingConnection) {
      const grant = pendingConnection;
      try {
        const selection = await requestJSON('/v1/google-source-selection/'+encodeURIComponent(grant));
        if (!container.isConnected) return;
        if (!workspaces.some(item=>item.id===selection.workspace)) throw new Error('This workspace is no longer available.');
        workspace = selection.workspace;
        selecting = true;
        drawSelection(grant,selection);
      } catch(error) {
        clearSelection();
        message(error.message);
      }
    }
    connectionWorkspace = workspace;
    drawWorkspace(workspaces);
    await refresh();
  } catch(error) {
    if (container.isConnected) message(error.message);
  }
}

async function openHubSpotCRM() {
  const panel = document.getElementById('hubspot-crm');
  if (!panel) return;
  const workspace = choiceCards('CRM workspace',{compact:true});
  const refresh = connectionElement('button','Refresh HubSpot data');
  refresh.type = 'button';
  refresh.disabled = true;
  const status = connectionElement('p','Reading workspaces…');
  status.setAttribute('role','status');
  const records = connectionElement('div');
  panel.replaceChildren(connectionElement('h3','HubSpot CRM'), workspace.root, refresh, status, records);
  async function load() {
    const selected = workspace.value;
    records.replaceChildren();
    status.textContent = 'Reading HubSpot CRM…';
    refresh.disabled = true;
    try {
      const path = hubspotURL(selected);
      const details = await requestJSON(path);
      if (workspace.value !== selected || !panel.isConnected) return;
      if (!details.portal_id) {
        status.textContent = details.configured
          ? 'Connect HubSpot in Connected accounts to see contacts and deals.'
          : 'HubSpot OAuth setup required.';
        return;
      }
      const data = await requestJSON(path+'/summary');
      if (workspace.value !== selected || !panel.isConnected) return;
      status.textContent = 'HubSpot account '+details.portal_id;
      for (const [key, title, name] of [
        ['contacts','Contacts', item => [item.firstname,item.lastname].filter(Boolean).join(' ') || 'Unnamed contact'],
        ['deals','Deals', item => item.dealname || 'Unnamed deal']
      ]) {
        const group = data[key];
        records.append(connectionElement('h4',title));
        if (!group.rows.length) {
          records.append(connectionElement('p','No '+key+' returned by HubSpot.'));
          continue;
        }
        const list = connectionElement('ul');
        for (const item of group.rows) list.append(connectionElement('li',name(item)));
        records.append(list);
        if (group.has_more) records.append(connectionElement('p','Showing the first '+group.rows.length+' '+key+'.'));
      }
    } catch(error) {
      if (workspace.value === selected) status.textContent = 'Could not read HubSpot CRM. Refresh or reconnect in Connected accounts.';
    } finally {
      if (workspace.value === selected) refresh.disabled = false;
    }
  }
  workspace.onchange = refresh.onclick = load;
  try {
    workspace.setOptions(await requestJSON('/v1/workspaces'));
    if (workspace.value) await load();
    else status.textContent = 'No workspace is available for this account.';
  } catch(error) {
    status.textContent = 'Could not load workspaces.';
  }
}

function drawGoogleTrend(canvas, points, metric, realtime, start, end) {
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  if (!width || !height) return;
  const ratio = window.devicePixelRatio || 1;
  canvas.width = Math.round(width * ratio);
  canvas.height = Math.round(height * ratio);
  const ctx = canvas.getContext('2d');
  ctx.scale(ratio, ratio);
  const left = 52, top = 18, right = width - 8, bottom = height - 18;
  const plotWidth = right - left, plotHeight = bottom - top;
  const max = Math.max(1, ...points.map(point => point[metric]));
  const step = max <= 4 ? 1 : Math.ceil(max / 4);
  const ceiling = step * 4;
  ctx.font = '11px system-ui';
  ctx.fillStyle = '#535d53';
  ctx.strokeStyle = '#ded9ca';
  const format = new Intl.NumberFormat(undefined,{notation:'compact'});
  for (let i = 0; i <= 4; i++) {
    const y = bottom - i * plotHeight / 4;
    ctx.fillText(format.format(step * i),2,y+4);
    ctx.beginPath();
    ctx.moveTo(left,y);
    ctx.lineTo(right,y);
    ctx.stroke();
  }
  const day = value => Date.parse(value+'T00:00:00Z') / 86400000;
  const duration = realtime ? 29 : Math.max(1,day(end)-day(start));
  const bars = Math.max(3, Math.min(22, plotWidth/(duration+1)*.65));
  const gradient = ctx.createLinearGradient(0,top,0,bottom);
  gradient.addColorStop(0,'#83f1c8');
  gradient.addColorStop(1,'#286e62');
  ctx.fillStyle=gradient;
  for (const point of points) {
    const offset = realtime ? 29-Number(point.time) : day(point.time)-day(start);
    const x = left + (offset+.5)*(plotWidth-bars)/(duration+1);
    const size = point[metric]*plotHeight/ceiling;
    if (Number.isFinite(size) && Number.isFinite(x) && size > 0) ctx.fillRect(x,bottom-size,bars,size);
  }
}

    refresh.disabled=!!inflight || !item;
    title.textContent=metric+' over time';
    stamp.textContent=refreshedAt ? 'Updated '+refreshedAt.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+(healthy ? '' : ' · stale') : '';
    metrics.replaceChildren();
    metrics.hidden=!item;
    for (const label of labels) {
      const tile=make('button');
      tile.type='button';
      tile.className='analytics-kpi';
      tile.setAttribute('aria-pressed',String(metric===label));
      const value=result?.metrics[label];
      tile.append(make('span',label),make('strong',Number.isFinite(value) ? value.toLocaleString() : '—'));
      tile.onclick=()=>{metric=label;render();};
      metrics.append(tile);
    }
    const points=(result?.series || []).slice().sort((a,b)=>realtime ? Number(b.time)-Number(a.time) : a.time.localeCompare(b.time));
    canvas.hidden=!points.some(point=>Number.isFinite(point[metric]));
    foot.replaceChildren();
    table.replaceChildren();
    table.hidden=canvas.hidden;
    if (canvas.hidden) return;
    canvas.setAttribute('aria-label',metric+' chart. Open the data table below for exact values.');
    foot.append(make('span',realtime ? '29 minutes ago' : result.start),make('span',realtime ? 'Now' : result.end));
    draw();
    table.append(make('summary','View data table'));
    const grid=make('table'), head=make('thead'), row=make('tr');
    for (const label of [realtime ? 'Minute' : 'Date',...labels]) row.append(make('th',label));
    head.append(row);
    const body=make('tbody');
    for (const point of points) {
      const line=make('tr');
      line.append(make('td',realtime ? point.time+' min ago' : point.time));
      for (const label of labels) line.append(make('td',point[label]?.toLocaleString() ?? '—'));
      body.append(line);
    }
    grid.append(head,body);
    table.append(grid);
  }
  function feedback(message,error=false) {
    status.hidden=!message;
    status.textContent=message;
    status.dataset.error=String(error);
  }
  function reset() {
    clearPoll();
    inflight?.abort();
    inflight=null;
    result=null;
    healthy=false;
    refreshedAt=null;
  }
  async function loadReport() {
    clearPoll();
    const item=properties[property.value];
    if (!item || inflight || !panel.isConnected) return;
    const controller=new AbortController();
    inflight=controller;
    if (!result) feedback('Reading Google data…');
    render();
    const base='/v1/workspaces/'+encodeURIComponent(workspace.value)+'/google-sources';
    const query=new URLSearchParams({property_id:item.id,series:'true',days:days.value});
    if (realtime) query.set('realtime','true');
    try {
      const response=await fetch(base+'/'+item.source+'/report?'+query,{signal:controller.signal,credentials:'same-origin'});
      const data=await response.json();
      if (controller.signal.aborted || !panel.isConnected) return;
      if (!response.ok) throw new Error(sourceErrors[data.detail] || 'Google report could not be loaded.');
      result=data;
      healthy=true;
      refreshedAt=new Date();
      feedback(data.series.length ? '' : realtime ? 'Google reports no activity in the last 30 minutes.' : 'Google returned no data for this date range.');
    } catch (error) {
      if (controller.signal.aborted || !panel.isConnected) return;
      healthy=false;
      feedback(error.message,true);
    } finally {
      if (inflight===controller) {
        inflight=null;
        if (panel.isConnected) {
          render();
          if (healthy || !result) schedulePoll();
        }
      }
    }
  }
  function showChannel(preferredProperty) {
    reset();
    realtime=false;
    metric='';
    property.setOptions(properties.flatMap((item,index)=>item.source===channel.value
      ? [{id:index,name:sourceDisplayName(item.source,item.name)}] : []),preferredProperty);
    if (!property.value) {
      feedback('No saved '+channelLabels[channel.value]+' connection. Open Connected accounts to add one.');
      render();
      return;
    }
    loadReport();
  }
  async function listProperties(preferredProperty) {
    const current=++revision;
    reset();
    realtime=false;
    metric='';
    properties=[];
    channel.setOptions([]);
    property.setOptions([]);
    render();
    feedback('Loading connected channels…');
    try {
      const base='/v1/workspaces/'+encodeURIComponent(workspace.value)+'/google-sources';
      const saved=await requestJSON(base);
      if (current!==revision || !panel.isConnected) return;
      properties=saved.slice().sort((a,b)=>Number(b.source==='search-console')-Number(a.source==='search-console') || a.name.localeCompare(b.name));
      const preferredIndex = properties.findIndex(item=>item.id===preferredProperty);
      const initialSource = properties[preferredIndex]?.source ?? properties[0]?.source;
      const channels = Object.entries(channelLabels).map(([id,name])=>{
        const count = properties.filter(item=>item.source===id).length;
        return {id,name,note:count===0 ? 'Not connected' : count+' saved'};
      });
      channel.setOptions(channels,initialSource);
      showChannel(preferredIndex);

    } catch(error) { if (current===revision) feedback(error.message,true); }
  }
  const chooseMode = selected => {
    if (realtime===selected) return;
    realtime=selected;
    reset();
    loadReport();
  };
  workspace.onchange=()=>listProperties();
  channel.onchange=()=>showChannel();
  property.onchange=()=>{realtime=false;reset();loadReport();};
  days.onchange=()=>{reset();loadReport();};
  refresh.onclick=loadReport;
  historyButton.onclick=()=>chooseMode(false);
  realtimeButton.onclick=()=>chooseMode(true);
  render();
  try {
    const workspaces = await requestJSON('/v1/workspaces');
    if (!panel.isConnected) return;
    workspace.setOptions(workspaces,preferred?.workspace);
    if (workspace.value) await listProperties(preferred?.workspace===workspace.value ? preferred.property : undefined);
    else feedback('No workspace is available for this account.');
  } catch(error) { feedback(error.message,true); }
}
document.querySelectorAll('nav button')[3].addEventListener('click',openGoogleAnalytics);
const channelLabels = {'ga4':'Google Analytics 4','search-console':'Google Search Console','youtube':'YouTube'};

async function openChannelWorkspace() {
  const container = document.getElementById('channel-workspace');
  if (!container) return;
  const el = connectionElement;
  const hero = el('div');
  hero.className = 'channel-hero';
  const heading = el('div');
  heading.append(el('p','Last 7 completed days'),el('h1','Weekly marketing review'),el('p','Review results, see what needs attention, and prepare your next move.'));
  const controls = el('div');
  controls.className = 'channel-controls';
  const workspace = choiceCards('Workspace',{compact:true});
  const refresh = el('button','Refresh data');
  refresh.type = 'button';
  refresh.className = 'action';
  refresh.disabled = true;
  controls.append(workspace.root,refresh);
  hero.append(heading,controls);
  const status = el('p','Loading workspaces…');
  status.setAttribute('role','status');
  const cards = el('div');
  cards.className = 'channel-grid';
  const columns = el('div');
  columns.className = 'channel-columns';
  const details = el('section');
  details.className = 'card channel-panel channel-evidence';
  details.setAttribute('aria-live','polite');
  details.hidden = true;
  cards.setAttribute('aria-label','Weekly channel scorecard');

  const director = el('section');
  director.className = 'card channel-panel channel-mia';
  const form = el('form');
  form.className = 'channel-controls';
  const objective = choiceCards('Brief type',{compact:true});
  objective.setOptions([
    {id:'summary',name:'Performance summary'},
    {id:'growth',name:'Growth experiment'},
    {id:'content',name:'Content idea'},
  ]);
  const run = el('button','Generate brief');
  run.type = 'submit';
  run.className = 'action';
  run.disabled = true;
  form.append(objective.root,run);
  const aiStatus = el('p','Draft for review · Uses available Google channel reports');
  aiStatus.setAttribute('role','status');
  const result = el('div');
  director.append(el('h3','MIA brief'),form,aiStatus,result);

  const activity = el('section');
  activity.className = 'card channel-panel';
  const events = el('ul');
  events.className = 'channel-activity';
  const activityHeader = el('div');
  activityHeader.className = 'channel-panel-head';
  const filters = el('div');
  filters.className = 'channel-filters';
  filters.setAttribute('role','group');
  filters.setAttribute('aria-label','Filter activity');
  let filter = 'all';
  for (const [key, name] of [['all','All'],['verified','Verified'],['review','Needs review']]) {
    const button = el('button',name);
    button.type = 'button';
    button.setAttribute('aria-pressed',String(key==='all'));
    button.onclick = () => {
      filter = key;
      for (const item of filters.children) item.setAttribute('aria-pressed',String(item===button));
      drawActivity();
    };
    filters.append(button);
  }
  activityHeader.append(el('h3','Activity & follow-up'),filters);
  activity.append(activityHeader,events);
  columns.append(details,director,activity);
  container.replaceChildren(hero,status,cards,columns);

  let revision = 0;
  const path = () => '/v1/workspaces/'+encodeURIComponent(workspace.value);
  const nav = index => document.querySelectorAll('nav button')[index].click();
  function link(label, index) {
    const button = el('button',label);
    button.type = 'button';
    button.className = 'action';
    button.onclick = () => nav(index);
    return button;
  }
  let records = [];
  let checks = [];
  let historyLoading = true;
  let healthLoading = true;
  let historyError = false;
  let selectedSource = 'search-console';
  const labels = {...channelLabels, hubspot:'HubSpot'};
  const numbers = new Intl.NumberFormat();
  function drawCards(data, crm) {
    const reports = data.reports;
    const visible = [];
    checks = [];
    for (const [source,title] of Object.entries(labels)) {
      const record = source==='hubspot' ? crm : reports.find(item=>item.source===source);
      const state = record?.status || 'unsaved';
      const isCRM = source==='hubspot';
      const description = state==='available' ? (isCRM ? 'Live CRM records' : sourceDisplayName(source,record.name))
        : state==='empty' ? 'Provider returned no rows for this period.'
        : state==='unsaved' ? 'No saved connection.'
        : state==='setup' ? 'HubSpot OAuth setup required.'
        : ({reconnect:'Authorization expired or was revoked.', 'api-disabled':'Provider API is disabled.', permission:'Account lacks access to this report.'}[record?.detail] || 'Provider report unavailable.');
      const metrics = Object.entries(record?.metrics || {});
      const button = el('button');
      button.type = 'button';
      button.className = 'channel-score';
      button.setAttribute('aria-controls','review-source-details');
      button.append(el('span',title),el('strong',metrics.length ? numbers.format(metrics[0][1])
        : ({empty:'No rows',unsaved:'Connect',setup:'Setup required'}[state] || 'Unavailable')),
        el('small',metrics.length ? metrics[0][0] : description));
      visible.push(button);
      function showDetails() {
        selectedSource = source;
        for (const item of visible) item.setAttribute('aria-pressed',String(item===button));
        const head = el('div');
        head.className = 'channel-panel-head';
        const badge = el('span',state==='available' ? 'Report available' : 'Needs review');
        badge.className = 'channel-badge';
        badge.dataset.tone = state==='available' ? 'verified' : 'review';
        head.append(el('h3',title),badge);
        details.replaceChildren(head,el('p',description));
        if (metrics.length) {
          const list = el('dl');
          list.className = 'channel-facts';
          for (const [key,value] of metrics) {
            const pair = el('div');
            pair.append(el('dt',key),el('dd',numbers.format(value)));
            list.append(pair);
          }
          details.append(list);
        }
        if (isCRM && record?.additional) details.append(el('p','More records are available in HubSpot.'));
        if (record?.start) details.append(el('p',record.start+' to '+record.end));
        const canView = state==='available'||state==='empty';
        details.append(link(canView ? (isCRM?'Open Leads & CRM':'Open Analytics') : 'Manage connection',canView ? (isCRM?5:3) : 1));
        details.hidden = false;
      }
      button.onclick = showDetails;
      checks.push({label:title,note:state==='available' ? (isCRM ? 'CRM records loaded' : 'Report loaded') : description,
        kind:state==='available' ? 'verified' : 'review'});
      if (source===selectedSource) button.dataset.selected='true';
    }
    cards.replaceChildren(...visible);
    (visible.find(button=>button.dataset.selected)||visible[0]).click();
  }
  details.id = 'review-source-details';
  function drawActivity() {
    const rows = [...checks,...records].filter(row=>filter==='all'||row.kind===filter);
    events.replaceChildren(...rows.slice(0,10).map(item=>{
      const li = el('li');
      const badge = el('span',item.kind==='verified'?'Verified':'Needs review');
      badge.className = 'channel-badge';
      badge.dataset.tone = item.kind;
      const text = el('div');
      text.append(el('strong',item.label));
      if (item.note) text.append(el('p',item.note));
      const date = new Date(item.date);
      if (!Number.isNaN(date.valueOf())) {
        const time = el('time',date.toLocaleString());
        time.dateTime = date.toISOString();
        text.append(time);
      }
      li.append(badge,text);
      return li;
    }));
    if (historyLoading||healthLoading) events.append(el('li','Checking recent activity and sources…'));
    else if (!rows.length) events.append(el('li','No matching activity.'));
    if (historyError) events.append(el('li','Some recorded activity could not be loaded.'));
  }
  async function loadActivity(base, version) {
    const [tools,drafts] = await Promise.allSettled([
      requestJSON(base+'/activity'),requestJSON(base+'/drafts'),
    ]);
    if (!container.isConnected || version!==revision) return;
    if (tools.status==='fulfilled') for (const item of tools.value) {
      const outcome = String(item.outcome);
      records.push({label:item.tool,note:outcome,date:item.created_at,
        kind:/^(ok|success|succeeded|allowed|completed)$/i.test(outcome)?'verified':'review'});
    }
    if (drafts.status==='fulfilled') for (const item of drafts.value) {
      records.push({label:item.payload?.title || item.kind,note:'Draft saved',date:item.created_at,kind:'verified'});
    }
    records.sort((a,b)=>Date.parse(b.date)-Date.parse(a.date));
    historyLoading = false;
    historyError = tools.status==='rejected'||drafts.status==='rejected';
    drawActivity();
  }
  async function loadHubSpot(base) {
    try {
      const config = await requestJSON(base+'/hubspot');
      if (!config.configured) return {status:'setup'};
      if (!config.portal_id) return {status:'unsaved'};
      const result = await requestJSON(base+'/hubspot/summary');
      return {status:'available',metrics:{'Contacts on first page':result.contacts.rows.length,
        'Deals on first page':result.deals.rows.length},additional:result.contacts.has_more||result.deals.has_more};
    } catch {
      return {status:'unavailable'};
    }
  }
  async function load() {
    if (!workspace.value) return;
    const base = path();
    const version = ++revision;
    refresh.disabled = true;
    run.disabled = true;
    result.replaceChildren();
    aiStatus.textContent = 'Draft for review · Uses available Google channel reports';
    cards.replaceChildren();
    details.hidden = true;
    records = [];
    checks = [];
    historyLoading = true;
    healthLoading = true;
    historyError = false;
    drawActivity();
    status.textContent = 'Checking live provider reports…';
    const activityRequest = loadActivity(base, version);
    try {
      const [google,crm] = await Promise.allSettled([requestJSON(base+'/channel-overview'),loadHubSpot(base)]);
      if (version!==revision || !container.isConnected) return;
      const crmRecord = crm.status==='fulfilled'?crm.value:{status:'unavailable'};
      const data = google.status==='fulfilled'?google.value:{reports:Object.keys(channelLabels).map(source=>({source,status:'unavailable'}))};
      drawCards(data,crmRecord);
      const count = data.reports.filter(item=>item.status==='available').length + Number(crmRecord.status==='available');
      status.textContent = count+' of 4 sources returned data';
      status.className = 'channel-status';
    } finally {
      if (version===revision) {
        healthLoading = false;
        drawActivity();
        refresh.disabled = run.disabled = false;
      }
    }
    await activityRequest;
  }
  workspace.onchange = refresh.onclick = load;
  form.onsubmit = async event => {
    event.preventDefault();
    if (run.disabled) return;
    const version = revision;
    run.disabled = true;
    result.replaceChildren();
    aiStatus.textContent = 'Refreshing channel evidence and writing the brief…';
    try {
      const brief = await requestJSON(path()+'/channel-brief', {
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({objective:objective.value}),
      });
      if (version!==revision || !container.isConnected) return;
      aiStatus.textContent = 'Draft generated from '+brief.evidence.length+' provider report'+(brief.evidence.length===1?'':'s')+'.';
      const draft = el('div');
      draft.className = 'channel-brief';
      draft.append(el('p',brief.brief),el('h4','Suggested next step'),el('p',brief.next_step));
      const evidence = el('ul');
      for (const report of brief.evidence) {
        const totals = Object.entries(report.metrics).map(([name,value])=>name+' '+new Intl.NumberFormat().format(value));
        evidence.append(el('li',channelLabels[report.source]+' · '+report.start+' to '+report.end+' · '+totals.join(', ')));
      }
      const disclosure = el('details');
      disclosure.append(el('summary','See provider evidence'),evidence);
      result.append(draft,disclosure);
      if (brief.missing_sources.length) result.append(el('p','Missing metrics from '+brief.missing_sources.map(key=>channelLabels[key]).join(', ')+'.'));
    } catch(error) {
      if (version===revision) aiStatus.textContent = error.message.replace(/Local Qwen/g,'MIA').replace(/The Marketing Director/g,'MIA');
    } finally {
      if (version===revision) run.disabled = false;
    }
  };
  try {
    workspace.setOptions(await requestJSON('/v1/workspaces'));
    if (workspace.value) await load();
    else status.textContent = 'No workspace available for this account.';
  } catch(error) {
    status.textContent = error.message;
  }
}

const googleLink = document.getElementById('google-link-form');
googleLink?.addEventListener('submit', async event => {
  event.preventDefault();
  const password = document.getElementById('google-link-password');
  const code = document.getElementById('google-link-code');
  const status = document.getElementById('google-link-status');
  const button = googleLink.querySelector('button');
  if (button.disabled) return;
  button.disabled = true;
  status.textContent = '';
  try {
    const response = await fetch('/v1/auth/google/link', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: password.value, code: code.value})
    });
    if (response.status === 429) {
      status.textContent = 'Too many attempts. Wait before trying again.';
      return;
    }
    if (!response.ok) {
      status.textContent = 'Could not verify the account. Check your password and enter a fresh authenticator code.';
      return;
    }
    const result = await response.json();
    location.assign(result.authorization_url);
  } catch {
    status.textContent = 'Could not start Google linking. Try again.';
  } finally {
    password.value = '';
    code.value = '';
    button.disabled = false;
  }
});

    signOut.textContent = 'Retry sign out';
    signOut.disabled = false;
  }
