<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · SafeNestT Marketing Intelligence</title><style>body{margin:0;background:#0a101c;color:#e7edf7;font:15px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(380px,85vw);background:#111b2b;border:1px solid #263347;padding:32px;border-radius:16px}label{display:block;margin:16px 0 6px}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;border:1px solid #38475d;background:#0a101c;color:inherit;font:inherit}button{background:#1c514e;margin-top:20px}p{color:#91a2bb}strong{color:#6edbc6}</style><main><strong>SafeNestT MI</strong><h1>Welcome back</h1><p>Marketing Intelligence · Powered by RZ AI</p><form id="login"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required minlength="12"><button>Sign in</button></form><button id="google" data-google-enabled="0" type="button" disabled aria-describedby="google-status">Continue with Google</button><p id="google-status">Google sign-in is being configured.</p><form id="mfa" hidden><label for="code">Authenticator or recovery code</label><input id="code" autocomplete="one-time-code" required><button>Verify</button></form><p id="enrollment" hidden></p><p id="message" role="status">Private preview. Registration is disabled.</p></main><script>
const $=id=>document.getElementById(id),m=$('message');let enrolling=false;
async function post(path,data={}){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error('Authentication unsuccessful. Start sign-in again.');return r.json()}
function showMfa(){ $('login').hidden=true;$('google').hidden=true;$('mfa').hidden=false; }
if($('google').dataset.googleEnabled==='1'){$('google').disabled=false;$('google-status').textContent='';$('google').onclick=()=>location.assign('/oauth/google/start');}
if(new URLSearchParams(location.search).get('mfa')==='verify')showMfa();
$('login').onsubmit=async e=>{e.preventDefault();try{const d=await post('/v1/auth/login',{email:$('email').value,password:$('password').value});if(d.mfa_required){showMfa();if(d.owner_enrollment){enrolling=true;const a=await post('/v1/auth/mfa/enroll');$('enrollment').hidden=false;$('enrollment').textContent='Add this URI to your authenticator: '+a.enrollment_uri;}}else location.assign('/');}catch(e){m.textContent=e.message}finally{$('password').value=''}};
$('mfa').onsubmit=async e=>{e.preventDefault();try{const d=await post('/v1/auth/mfa/'+(enrolling?'confirm':'verify'),{code:$('code').value});if(d.recovery_codes){$('enrollment').hidden=false;$('enrollment').textContent='Save these recovery codes securely: '+d.recovery_codes.join(' ');$('mfa').hidden=true;const b=document.createElement('button');b.textContent='Continue';b.onclick=()=>location.assign('/');$('enrollment').after(b);}else location.assign('/');}catch(e){m.textContent=e.message}finally{$('code').value=''}};
</script></html>
