<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · SafeNestT Marketing Intelligence</title><style>body{margin:0;background:#0a101c;color:#e7edf7;font:15px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(380px,85vw);background:#111b2b;border:1px solid #263347;padding:32px;border-radius:16px}label{display:block;margin:16px 0 6px}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;border:1px solid #38475d;background:#0a101c;color:inherit;font:inherit}button{background:#1c514e;margin-top:20px}p{color:#91a2bb}strong{color:#6edbc6}</style><main><strong>SafeNestT MI</strong><h1>Welcome back</h1><p>Marketing Intelligence · Powered by RZ AI</p><form id="login"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required minlength="12"><button>Sign in</button></form><button type="button" disabled aria-describedby="google-status">Continue with Google</button><p id="google-status">Google sign-in is being configured.</p><p id="message" role="status">Private preview. Registration is disabled.</p></main><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('message');try{const r=await fetch('/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});if(r.ok)location.reload();else m.textContent=r.status===503?'Login not activated.':'Sign-in unsuccessful.';}catch{m.textContent='Service unavailable.';}finally{document.getElementById('password').value='';}};</script></html>
